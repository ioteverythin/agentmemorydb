<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="880" height="300" rx="14" fill="#0d1117"/>
  <text x="32" y="46" fill="#e6edf3" font-size="22" font-weight="700">Event → Observation → Memory</text>
  <text x="32" y="70" fill="#8b949e" font-size="14">An append-only, auditable pipeline. Nothing is a direct write — every memory has provenance.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Event -->
  <rect x="40" y="120" width="200" height="96" rx="10" fill="#161b22" stroke="#f2cc60" stroke-width="1.5"/>
  <text x="140" y="150" fill="#f2cc60" font-size="16" font-weight="700" text-anchor="middle">Event</text>
  <text x="140" y="174" fill="#8b949e" font-size="12.5" text-anchor="middle">immutable, append-only</text>
  <text x="140" y="193" fill="#8b949e" font-size="12.5" text-anchor="middle">user input · tool result</text>

  <!-- Observation -->
  <rect x="340" y="120" width="200" height="96" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="440" y="150" fill="#58a6ff" font-size="16" font-weight="700" text-anchor="middle">Observation</text>
  <text x="440" y="174" fill="#8b949e" font-size="12.5" text-anchor="middle">candidate, confidence-scored</text>
  <text x="440" y="193" fill="#8b949e" font-size="12.5" text-anchor="middle">pending → accepted / rejected</text>

  <!-- Memory -->
  <rect x="640" y="120" width="200" height="96" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="740" y="150" fill="#3fb950" font-size="16" font-weight="700" text-anchor="middle">Memory</text>
  <text x="740" y="174" fill="#8b949e" font-size="12.5" text-anchor="middle">canonical, versioned</text>
  <text x="740" y="193" fill="#8b949e" font-size="12.5" text-anchor="middle">hash-dedup · audit trail</text>

  <line x1="242" y1="168" x2="336" y2="168" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="289" y="158" fill="#c9d1d9" font-size="12" text-anchor="middle">extract</text>

  <line x1="542" y1="168" x2="636" y2="168" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="589" y="158" fill="#c9d1d9" font-size="12" text-anchor="middle">promote</text>

  <!-- lifecycle emission -->
  <text x="740" y="248" fill="#8b949e" font-size="12" text-anchor="middle">↓ emits</text>
  <text x="740" y="270" fill="#bc8cff" font-size="12.5" text-anchor="middle" font-weight="600">webhook · WebSocket event</text>
</svg>
