<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="880" height="360" rx="14" fill="#0d1117"/>
  <text x="32" y="46" fill="#e6edf3" font-size="22" font-weight="700">Hybrid Retrieval — RRF fusion</text>
  <text x="32" y="70" fill="#8b949e" font-size="14">Dense semantics and sparse lexical matches are fused, then re-ranked by a governance score.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Query -->
  <rect x="40" y="150" width="150" height="60" rx="10" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="115" y="178" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">Query</text>
  <text x="115" y="197" fill="#8b949e" font-size="12" text-anchor="middle">text + embedding</text>

  <!-- Dense -->
  <rect x="260" y="96" width="220" height="66" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="370" y="124" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">Dense · vector (pgvector)</text>
  <text x="370" y="145" fill="#8b949e" font-size="12" text-anchor="middle">HNSW cosine · ef_search tuned</text>

  <!-- Sparse -->
  <rect x="260" y="198" width="220" height="66" rx="10" fill="#161b22" stroke="#f2cc60" stroke-width="1.5"/>
  <text x="370" y="226" fill="#f2cc60" font-size="15" font-weight="700" text-anchor="middle">Sparse · full-text (BM25)</text>
  <text x="370" y="247" fill="#8b949e" font-size="12" text-anchor="middle">tsvector · ts_rank</text>

  <!-- RRF -->
  <rect x="520" y="147" width="130" height="66" rx="10" fill="#161b22" stroke="#39c5cf" stroke-width="1.5"/>
  <text x="585" y="176" fill="#39c5cf" font-size="15" font-weight="700" text-anchor="middle">RRF fusion</text>
  <text x="585" y="196" fill="#8b949e" font-size="12" text-anchor="middle">k = 60</text>

  <!-- Re-rank -->
  <rect x="686" y="140" width="162" height="80" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="767" y="166" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">Re-rank</text>
  <text x="767" y="187" fill="#8b949e" font-size="11.5" text-anchor="middle">recency · importance</text>
  <text x="767" y="204" fill="#8b949e" font-size="11.5" text-anchor="middle">authority · confidence</text>

  <line x1="192" y1="172" x2="256" y2="132" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="192" y1="188" x2="256" y2="228" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="482" y1="129" x2="517" y2="165" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="482" y1="231" x2="517" y2="195" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="652" y1="180" x2="682" y2="180" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <text x="440" y="316" fill="#8b949e" font-size="13" text-anchor="middle">Surfaces both the semantically similar and the lexically exact.</text>
</svg>
